<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificador de isolamento · Glamore</title><style>body{font-family:system-ui;background:#f4f1ec;color:#1c1a1f;margin:0;padding:2rem}.box{max-width:1000px;margin:auto;background:#fff;padding:1.5rem;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}label{display:flex;flex-direction:column;gap:.5rem;font-weight:700}input{padding:1rem;border:1px solid #ddd;border-radius:10px}button{margin-top:1rem;padding:.8rem 1rem;border:0;border-radius:10px;background:#8d5b65;color:#fff;font-weight:700}.ok{color:#287a55}.erro{color:#a53b42}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{text-align:left;border-bottom:1px solid #eee;padding:.7rem;font-size:.85rem}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>Verificador de isolamento</h1><p>Selecione uma exportação do Realtime Database feita antes e outra feita depois dos testes. O verificador compara os nós operacionais protegidos e ignora somente o novo nó <code>precificacao</code>.</p><div class="grid"><label>Exportação anterior<input id="before" type="file" accept="application/json"></label><label>Exportação posterior<input id="after" type="file" accept="application/json"></label></div><button id="compare">Comparar nós operacionais</button><div id="result"></div></main><script type="module" src="./js/verificador.js"></script></body></html>
