<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17151b" />
  <meta name="description" content="Engenharia de custos e precificação de joias em prata, bronze e produtos banhados." />
  <title>Glamore Custos & Precificação</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/app.css?v=1.0.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>
</head>
<body>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark">G</div>
      <p class="eyebrow">GLAMORE JOIAS</p>
      <h1>Custos & Precificação</h1>
      <p class="muted">Ambiente isolado para engenharia de custos, fichas técnicas, margens e projeções.</p>
      <form id="loginForm" class="stack-lg">
        <label>E-mail<input type="email" name="email" autocomplete="username" required /></label>
        <label>Senha<input type="password" name="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary btn-block" type="submit">Entrar com a conta da Glamore</button>
      </form>
      <p id="loginError" class="form-error" hidden></p>
      <small>Usa o mesmo Firebase Authentication do sistema atual.</small>
    </div>
  </section>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">G</div>
        <div><strong>Glamore</strong><span>Custos & Precificação</span></div>
      </div>
      <nav id="mainNav" class="nav-list"></nav>
      <div class="sidebar-footer">
        <div id="userMini" class="user-mini"></div>
        <button id="logoutBtn" class="btn btn-ghost btn-block">Sair</button>
        <small>Powered by thIAguinho Soluções Digitais</small>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Abrir menu">☰</button>
        <div><p class="eyebrow" id="pageEyebrow">GLAMORE</p><h2 id="pageTitle">Painel</h2></div>
        <div class="top-actions"><span id="connectionBadge" class="badge badge-success">Firebase conectado</span><button id="refreshBtn" class="icon-btn" title="Atualizar">↻</button></div>
      </header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>
  <div id="modalHost"></div>
  <script type="module" src="./js/app.js?v=1.0.0"></script>
</body>
</html>
